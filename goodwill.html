<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goodwill Crew</title>
  <meta name="description" content="Invitation page for Goodwill Crew app testers" />
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --bg-3: #14532d;
      --card: rgba(255, 255, 255, 0.10);
      --card-border: rgba(255, 255, 255, 0.18);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --secondary: rgba(255, 255, 255, 0.08);
      --secondary-hover: rgba(255, 255, 255, 0.14);
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(59,130,246,0.25), transparent 30%),
        radial-gradient(circle at bottom right, rgba(34,197,94,0.22), transparent 28%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2) 55%, var(--bg-3));
      display: flex;
      flex-direction: column;
    }

    .topbar {
      padding: 20px 16px 0;
      display: flex;
      justify-content: center;
    }

    .flags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 10px 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .flag-btn {
      width: 54px;
      height: 54px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .flag-btn:hover,
    .flag-btn:focus-visible {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.14);
      border-color: rgba(255,255,255,0.28);
      outline: none;
    }

    .flag-btn.active {
      background: rgba(34,197,94,0.18);
      border-color: rgba(34,197,94,0.65);
      box-shadow: 0 0 0 3px rgba(34,197,94,0.12);
    }

    .flag-icon {
      width: 32px;
      height: 24px;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.18);
      flex-shrink: 0;
    }

    .wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px 40px;
    }

    .card {
      width: 100%;
      max-width: 920px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 42px 32px;
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(34,197,94,0.14);
      border: 1px solid rgba(34,197,94,0.35);
      color: #dcfce7;
      font-size: 0.95rem;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.12;
    }

    .lead {
      margin: 0 auto 16px;
      max-width: 760px;
      font-size: 1.12rem;
      line-height: 1.75;
      color: var(--muted);
    }

    .highlight {
      margin: 22px auto 0;
      max-width: 760px;
      padding: 18px 20px;
      border-radius: 20px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin-top: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 260px;
      padding: 15px 22px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-2px);
      outline: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #052e16;
    }

    .btn-primary:hover,
    .btn-primary:focus-visible {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--secondary);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.14);
      opacity: 0.95;
    }

    .btn-secondary:hover,
    .btn-secondary:focus-visible {
      background: var(--secondary-hover);
    }

    .note {
      margin-top: 22px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.6;
    }

    footer {
      padding: 0 16px 24px;
      text-align: center;
      color: rgba(255,255,255,0.65);
      font-size: 0.92rem;
    }

    @media (max-width: 640px) {
      .card {
        padding: 30px 20px;
        border-radius: 24px;
      }

      .flag-btn {
        width: 48px;
        height: 48px;
      }

      .flag-icon {
        width: 28px;
        height: 21px;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="flags" aria-label="Language selector">
      <button class="flag-btn active" data-lang="en" title="English" aria-label="English">
        <svg class="flag-icon" viewBox="0 0 64 48" aria-hidden="true">
          <rect width="64" height="48" fill="#b22234"/>
          <g fill="#fff">
            <rect y="4" width="64" height="4"/>
            <rect y="12" width="64" height="4"/>
            <rect y="20" width="64" height="4"/>
            <rect y="28" width="64" height="4"/>
            <rect y="36" width="64" height="4"/>
            <rect y="44" width="64" height="4"/>
          </g>
          <rect width="28" height="20" fill="#3c3b6e"/>
        </svg>
      </button>

      <button class="flag-btn" data-lang="es" title="Español" aria-label="Español">
        <svg class="flag-icon" viewBox="0 0 64 48" aria-hidden="true">
          <rect width="64" height="48" fill="#c60b1e"/>
          <rect y="12" width="64" height="24" fill="#ffc400"/>
        </svg>
      </button>

      <button class="flag-btn" data-lang="zh" title="中文" aria-label="中文">
        <svg class="flag-icon" viewBox="0 0 64 48" aria-hidden="true">
          <rect width="64" height="48" fill="#de2910"/>
          <polygon points="12,6 13.8,11 19,11 14.8,14.2 16.4,19 12,15.9 7.6,19 9.2,14.2 5,11 10.2,11" fill="#ffde00"/>
        </svg>
      </button>

      <button class="flag-btn" data-lang="fr" title="Français" aria-label="Français">
        <svg class="flag-icon" viewBox="0 0 64 48" aria-hidden="true">
          <rect width="21.33" height="48" x="0" fill="#0055a4"/>
          <rect width="21.34" height="48" x="21.33" fill="#ffffff"/>
          <rect width="21.33" height="48" x="42.67" fill="#ef4135"/>
        </svg>
      </button>

      <button class="flag-btn" data-lang="de" title="Deutsch" aria-label="Deutsch">
        <svg class="flag-icon" viewBox="0 0 64 48" aria-hidden="true">
          <rect width="64" height="16" y="0" fill="#000"/>
          <rect width="64" height="16" y="16" fill="#dd0000"/>
          <rect width="64" height="16" y="32" fill="#ffce00"/>
        </svg>
      </button>

      <button class="flag-btn" data-lang="ja" title="日本語" aria-label="日本語">
        <svg class="flag-icon" viewBox="0 0 64 48" aria-hidden="true">
          <rect width="64" height="48" fill="#fff"/>
          <circle cx="32" cy="24" r="11" fill="#bc002d"/>
        </svg>
      </button>

      <button class="flag-btn" data-lang="uk" title="Українська" aria-label="Українська">
        <svg class="flag-icon" viewBox="0 0 64 48" aria-hidden="true">
          <rect width="64" height="24" y="0" fill="#0057b7"/>
          <rect width="64" height="24" y="24" fill="#ffd700"/>
        </svg>
      </button>

      <button class="flag-btn" data-lang="ru" title="Русский" aria-label="Русский">
        <svg class="flag-icon" viewBox="0 0 64 48" aria-hidden="true">
          <rect width="64" height="16" y="0" fill="#fff"/>
          <rect width="64" height="16" y="16" fill="#0039a6"/>
          <rect width="64" height="16" y="32" fill="#d52b1e"/>
        </svg>
      </button>
    </div>
  </div>

  <main class="wrapper">
    <section class="card">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
      <p class="lead" id="intro"></p>

      <div class="highlight" id="groupText"></div>

      <div class="actions">
        <a
          id="groupLink"
          class="btn btn-primary"
          href="https://groups.google.com/g/goodwillcrew"
          target="_blank"
          rel="noopener noreferrer"
        ></a>

        <a
          id="supportLink"
          class="btn btn-secondary"
          href="https://gofund.me/dc023a039"
          target="_blank"
          rel="noopener noreferrer"
        ></a>

        <a
          id="appLink"
          class="btn btn-secondary"
          href="https://play.google.com/store/apps/details?id=com.lingobridge.app"
          target="_blank"
          rel="noopener noreferrer"
        ></a>
      </div>
      
      <div class="note" id="note"></div>
    </section>
  </main>

  <footer id="footer"></footer>

  <script>
    const translations = {
      en: {
        lang: "en",
        eyebrow: "Goodwill Crew",
        title: "Welcome, and thank you for participating!",
        intro: "We truly appreciate your interest and support. Your participation helps us improve the app and make it better for everyone.",
        groupText: "You are invited to join our Google Group for testing a paid application with a subscription cost of $5.",
        groupLink: "Join the tester group",
        supportLink: "Support us",
        appLink: "Open the app in Google Play",
        note: "First, please join the Google Group. After that, open the app page in Google Play.",
        footer: "Thank you for your support!"
      },
      es: {
        lang: "es",
        eyebrow: "Goodwill Crew",
        title: "¡Bienvenido y gracias por participar!",
        intro: "Agradecemos sinceramente su interés y apoyo. Su participación nos ayuda a mejorar la aplicación y hacerla mejor para todos.",
        groupText: "Le invitamos a unirse a nuestro Grupo de Google para probar una aplicación de pago con una suscripción de $5.",
        groupLink: "Unirse al grupo de testers",
        supportLink: "Apóyanos",
        appLink: "Abrir la app en Google Play",
        note: "Primero, únase al Grupo de Google. Después, abra la página de la aplicación en Google Play.",
        footer: "¡Gracias por su apoyo!"
      },
      zh: {
        lang: "zh-CN",
        eyebrow: "Goodwill Crew",
        title: "欢迎，感谢您的参与！",
        intro: "非常感谢您的关注与支持。您的参与将帮助我们改进这款应用，让它变得更好。",
        groupText: "诚邀您加入我们的 Google 群组，参与一款订阅费用为 5 美元的付费应用测试。",
        groupLink: "加入测试群组",
        supportLink: "支持我们",
        appLink: "在 Google Play 打开应用",
        note: "请先加入 Google 群组，然后在 Google Play 中打开应用页面。",
        footer: "感谢您的支持！"
      },
      fr: {
        lang: "fr",
        eyebrow: "Goodwill Crew",
        title: "Bienvenue, et merci de participer !",
        intro: "Nous apprécions sincèrement votre intérêt et votre soutien. Votre participation nous aide à améliorer l’application pour tout le monde.",
        groupText: "Nous vous invitons à rejoindre notre groupe Google pour tester une application payante avec un abonnement de 5 $.",
        groupLink: "Rejoindre le groupe de testeurs",
        supportLink: "Soutenez-nous",
        appLink: "Ouvrir l’application dans Google Play",
        note: "Veuillez d’abord rejoindre le groupe Google, puis ouvrir la page de l’application dans Google Play.",
        footer: "Merci pour votre soutien !"
      },
      de: {
        lang: "de",
        eyebrow: "Goodwill Crew",
        title: "Willkommen und vielen Dank für Ihre Teilnahme!",
        intro: "Wir schätzen Ihr Interesse und Ihre Unterstützung sehr. Ihre Teilnahme hilft uns, die App zu verbessern und für alle besser zu machen.",
        groupText: "Wir laden Sie ein, unserer Google-Gruppe beizutreten, um eine kostenpflichtige App mit einem Abonnementpreis von 5 $ zu testen.",
        groupLink: "Der Testergruppe beitreten",
        supportLink: "Unterstützen Sie uns",
        appLink: "App in Google Play öffnen",
        note: "Bitte treten Sie zuerst der Google-Gruppe bei und öffnen Sie danach die App-Seite in Google Play.",
        footer: "Vielen Dank für Ihre Unterstützung!"
      },
      ja: {
        lang: "ja",
        eyebrow: "Goodwill Crew",
        title: "ご参加いただき、ありがとうございます！",
        intro: "ご関心とご支援に心より感謝いたします。皆さまのご参加は、アプリの改善に大いに役立ちます。",
        groupText: "月額 5 ドルの有料アプリをテストしていただくため、Google グループへのご参加をお願いいたします。",
        groupLink: "テスターグループに参加する",
        supportLink: "私たちを支援する",
        appLink: "Google Play でアプリを開く",
        note: "まず Google グループに参加し、その後 Google Play のアプリページを開いてください。",
        footer: "ご協力ありがとうございます！"
      },
      uk: {
        lang: "uk",
        eyebrow: "Goodwill Crew",
        title: "Вітаємо та дякуємо за участь!",
        intro: "Ми щиро цінуємо ваш інтерес і підтримку. Ваша участь допомагає нам покращувати застосунок і робити його кращим для всіх.",
        groupText: "Запрошуємо вас приєднатися до нашої Google-групи для тестування платного застосунку з вартістю підписки 5 $.",
        groupLink: "Приєднатися до групи тестувальників",
        supportLink: "Підтримайте нас",
        appLink: "Відкрити застосунок у Google Play",
        note: "Спочатку приєднайтеся до Google-групи, а потім відкрийте сторінку застосунку в Google Play.",
        footer: "Дякуємо за підтримку!"
      },
      ru: {
        lang: "ru",
        eyebrow: "Goodwill Crew",
        title: "Здравствуйте и спасибо за участие!",
        intro: "Мы искренне ценим ваш интерес и поддержку. Ваше участие помогает нам улучшать приложение и делать его лучше для всех.",
        groupText: "Приглашаем вас присоединиться к нашей Google-группе для тестирования платного приложения со стоимостью подписки $5.",
        groupLink: "Вступить в группу тестировщиков",
        supportLink: "Поддержите нас",
        appLink: "Открыть приложение в Google Play",
        note: "Сначала вступите в Google-группу, а затем откройте страницу приложения в Google Play.",
        footer: "Спасибо за вашу поддержку!"
      }
    };

    const elements = {
      eyebrow: document.getElementById("eyebrow"),
      title: document.getElementById("title"),
      intro: document.getElementById("intro"),
      groupText: document.getElementById("groupText"),
      groupLink: document.getElementById("groupLink"),
      supportLink: document.getElementById("supportLink"),
      appLink: document.getElementById("appLink"),
      note: document.getElementById("note"),
      footer: document.getElementById("footer")
    };

    const buttons = document.querySelectorAll(".flag-btn");

    function setLanguage(lang) {
      const t = translations[lang] || translations.en;

      document.documentElement.lang = t.lang;
      elements.eyebrow.textContent = t.eyebrow;
      elements.title.textContent = t.title;
      elements.intro.textContent = t.intro;
      elements.groupText.textContent = t.groupText;
      elements.groupLink.textContent = t.groupLink;
      elements.supportLink.textContent = t.supportLink;
      elements.appLink.textContent = t.appLink;
      elements.note.textContent = t.note;
      elements.footer.textContent = t.footer;

      buttons.forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });

      localStorage.setItem("goodwillLang", lang);
    }

    buttons.forEach(btn => {
      btn.addEventListener("click", () => setLanguage(btn.dataset.lang));
    });

    const savedLang = localStorage.getItem("goodwillLang");
    setLanguage(savedLang && translations[savedLang] ? savedLang : "en");
  </script>
</body>
</html>
